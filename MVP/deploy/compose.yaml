services:
  app:
    build:
      context: ../..
      dockerfile: MVP/deploy/Dockerfile
      args:
        KOVERR_APP_ORIGIN: ${KOVERR_APP_ORIGIN:?Set the public HTTPS pilot origin}
    environment:
      KOVERR_APP_ORIGIN: ${KOVERR_APP_ORIGIN}
      KOVERR_PILOT_MODE: invite-only
      KOVERR_SUPABASE_URL: ${KOVERR_SUPABASE_URL:?Set the Supabase origin}
      KOVERR_SUPABASE_PUBLISHABLE_KEY: ${KOVERR_SUPABASE_PUBLISHABLE_KEY:?Set the Supabase publishable key}
      KOVERR_SUPABASE_SECRET_KEY: ${KOVERR_SUPABASE_SECRET_KEY:?Set the Supabase server secret}
      KOVERR_HIBP_API_KEY: ${KOVERR_HIBP_API_KEY:?Set the Have I Been Pwned key}
      KOVERR_CONCIERGE_REVIEWER_IDS: ${KOVERR_CONCIERGE_REVIEWER_IDS:-}
    restart: unless-stopped

  proxy:
    image: caddy:2.11-alpine
    depends_on:
      app:
        condition: service_healthy
    environment:
      KOVERR_APP_ORIGIN: ${KOVERR_APP_ORIGIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
